[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bona-provider-inspector"
version = "0.1.0"
description = "Bona plugin — Amazon Inspector vulnerability findings provider"
requires-python = ">=3.11"
dependencies = [
    "bona>=0.4.0",
]

[project.entry-points."bona"]
inspector = "bona_provider_inspector.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/bona_provider_inspector"]
