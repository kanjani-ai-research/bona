[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bona-provider-detective"
version = "0.1.0"
description = "Bona plugin — AWS Detective behavior graphs and investigations"
requires-python = ">=3.11"
dependencies = ["bona>=0.4.0"]

[project.entry-points."bona"]
detective = "bona_provider_detective.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/bona_provider_detective"]
