# bona-domains.yaml — Domain classification rules
#
# Each domain declares matching rules. A resource matches if ANY rule hits.
# Resources matching no domain go to the 'unclassified_domain' (default: shared).
# Set 'include_shared_in_all: true' to make shared resources' edges available
# in every domain (prevents dangling targets).

domains:
  identity:
    description: "Identity and access management"
    tags:
      domain: [identity, scim, iam]
      app: [scim, identity]
    name_patterns:
      - "*scim*"
      - "*identity*"
      - "*cognito*"
      - "*sso*"
      - "*idp*"
    resource_types:
      - "AWS::Cognito::*"
      - "AWS::SSO::*"
      - "AWS::IdentityStore::*"
      - "AWS::IAM::SAMLProvider"
      - "AWS::IAM::OIDCProvider"

  security:
    description: "Secrets, encryption, and certificate management"
    tags:
      domain: [security, vault, crypto, vlt]
      app: [vault, vlt]
    name_patterns:
      - "*vault*"
      - "*kms*"
      - "*secret*"
      - "*acm*"
      - "*certificate*"
    resource_types:
      - "AWS::KMS::*"
      - "AWS::SecretsManager::*"
      - "AWS::ACM::*"

  ai-governance:
    description: "AI model governance, guardrails, and knowledge bases"
    tags:
      domain: [ai, governance, bedrock, gov]
      app: [gov, aigp]
    name_patterns:
      - "*gov*"
      - "*bedrock*"
      - "*guardrail*"
      - "*knowledge-base*"
      - "*agent*"
    resource_types:
      - "AWS::Bedrock::*"

  runtime:
    description: "Application runtime: containers, orchestration, service mesh"
    tags:
      domain: [runtime, run, ecs, fargate]
      app: [run]
    name_patterns:
      - "*run-app*"
      - "*ecs*"
      - "*fargate*"
      - "*ecr*"
      - "*service-discovery*"
    resource_types:
      - "AWS::ECS::*"
      - "AWS::ECR::*"
      - "AWS::ServiceDiscovery::*"

  analytics:
    description: "Data analytics, warehousing, and BI"
    tags:
      domain: [analytics, ana, data]
      app: [ana, analytics]
    name_patterns:
      - "*ana*"
      - "*athena*"
      - "*glue*"
      - "*analytics*"
    resource_types:
      - "AWS::Athena::*"
      - "AWS::Glue::*"

  observability:
    description: "Monitoring, alerting, and logging"
    tags:
      domain: [observability, obs, monitoring]
      app: [obs]
    name_patterns:
      - "*obs*"
      - "*cloudwatch*"
      - "*alarm*"
      - "*cloudtrail*"
    resource_types:
      - "AWS::CloudWatch::*"
      - "AWS::CloudTrail::*"

  shared:
    description: "Network and infrastructure shared across domains"
    resource_types:
      - "AWS::EC2::VPC"
      - "AWS::EC2::Subnet"
      - "AWS::EC2::SecurityGroup"
      - "AWS::EC2::InternetGateway"
      - "AWS::EC2::NatGateway"
      - "AWS::EC2::RouteTable"
      - "AWS::EC2::NetworkInterface"
      - "AWS::ElasticLoadBalancingV2::LoadBalancer"
      - "AWS::ElasticLoadBalancingV2::TargetGroup"
      - "AWS::ElasticLoadBalancingV2::Listener"
      - "AWS::SNS::Topic"
      - "AWS::SQS::Queue"

defaults:
  unclassified_domain: shared
  include_shared_in_all: true
