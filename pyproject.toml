[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bona"
version = "0.3.0"
description = "Infrastructure Asset Property Graph — the Joern for cloud."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "boto3>=1.35.0",
    "pydantic>=2.0",
    "pluggy>=1.4.0",
]

[project.scripts]
bona = "bona.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bona"]
