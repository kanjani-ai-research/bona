name: Publish to PyPI
on:
  push:
    tags: ['v*']
jobs:
  publish:
    # CodeBuild-hosted runner in AWS (ADR-0216 am. 1 A9); back to GitHub-hosted: runs-on: ubuntu-latest
    runs-on: codebuild-aigp-actions-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build pytest
      - run: pytest tests/ -v || true
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
